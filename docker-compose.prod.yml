# Production : app + postgres. Pas de reverse proxy ici : le Caddy du serveur
# (celui de Tableau-Clair) occupe déjà les ports 80/443 et route vers `mijote:3000`
# via le réseau Docker externe `proxy`.
# Usage : docker compose -f docker-compose.prod.yml --env-file .env up -d
name: mijote

services:
  mijote:
    image: ${APP_IMAGE:-ghcr.io/m-maillot/mijote:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://recettes:${POSTGRES_PASSWORD}@db:5432/recettes?schema=public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - default
      - proxy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recettes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recettes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recettes"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true

volumes:
  pgdata:
